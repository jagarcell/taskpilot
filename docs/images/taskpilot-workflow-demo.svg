<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="96" y="84" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="34" font-weight="700">TaskPilot workflow demo</text>
  <text x="96" y="120" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Issue → Analysis → Planning → Approval → Implementation → Testing → Review → Pull Request</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="1080" height="530" rx="24" fill="url(#panel)" stroke="#334155"/>
  </g>

  <g>
    <rect x="90" y="210" width="150" height="100" rx="18" fill="url(#blue)"/>
    <text x="165" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" font-weight="700">Issue</text>
    <text x="165" y="276" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="12">project + context</text>

    <rect x="290" y="210" width="150" height="100" rx="18" fill="url(#purple)"/>
    <text x="365" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" font-weight="700">Analysis</text>
    <text x="365" y="276" text-anchor="middle" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="12">agent review</text>

    <rect x="490" y="210" width="150" height="100" rx="18" fill="url(#green)"/>
    <text x="565" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" font-weight="700">Planning</text>
    <text x="565" y="276" text-anchor="middle" fill="#DCFCE7" font-family="Arial, sans-serif" font-size="12">implementation plan</text>

    <rect x="690" y="210" width="150" height="100" rx="18" fill="#F8FAFC"/>
    <text x="765" y="250" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="17" font-weight="700">Approval</text>
    <text x="765" y="276" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="12">human gate</text>

    <rect x="890" y="210" width="180" height="100" rx="18" fill="url(#amber)"/>
    <text x="980" y="250" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="17" font-weight="700">Implementation</text>
    <text x="980" y="276" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="12">GitHub branch + patch</text>

    <path d="M240 260H290" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M440 260H490" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 260H690" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M840 260H890" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <rect x="90" y="420" width="185" height="110" rx="18" fill="#0F172A" stroke="#2DD4BF"/>
    <text x="182.5" y="455" text-anchor="middle" fill="#5EEAD4" font-family="Arial, sans-serif" font-size="16" font-weight="700">Testing</text>
    <text x="182.5" y="480" text-anchor="middle" fill="#CCFBF1" font-family="Arial, sans-serif" font-size="12">build + test</text>

    <rect x="325" y="420" width="185" height="110" rx="18" fill="#0F172A" stroke="#E879F9"/>
    <text x="417.5" y="455" text-anchor="middle" fill="#F5D0FE" font-family="Arial, sans-serif" font-size="16" font-weight="700">Review</text>
    <text x="417.5" y="480" text-anchor="middle" fill="#FAE8FF" font-family="Arial, sans-serif" font-size="12">agent + human</text>

    <rect x="560" y="420" width="220" height="110" rx="18" fill="#0F172A" stroke="#60A5FA"/>
    <text x="670" y="455" text-anchor="middle" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="16" font-weight="700">Pull request</text>
    <text x="670" y="480" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="12">GitHub handoff</text>

    <rect x="840" y="420" width="220" height="110" rx="18" fill="#0F172A" stroke="#FBBF24"/>
    <text x="950" y="455" text-anchor="middle" fill="#FDE68A" font-family="Arial, sans-serif" font-size="16" font-weight="700">Human approval</text>
    <text x="950" y="480" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="12">merge gate</text>

    <path d="M275 475H325" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M510 475H560" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M780 475H840" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <path d="M170 310V420" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M980 310V420" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M980 400C980 360 980 340 980 310" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="90" y="570" width="1000" height="90" rx="18" fill="#111827" stroke="#374151"/>
    <text x="118" y="606" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="20" font-weight="700">Key design principle</text>
    <text x="118" y="636" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Every stage remains observable, reviewable, and governed by human approval instead of hidden automation.</text>
  </g>
</svg>
